name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'

  - title: 'Bug Fixes'
    labels:
      - 'bug'
      - 'fix'

  - title: 'Maintenance'
    labels:
      - 'maintenance'
      - 'chore'
      - 'dependencies'

  - title: 'Documentation'
    labels:
      - 'documentation'
      - 'docs'

change-template: '- $TITLE (#$NUMBER)'

change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'maintenance'
      - 'chore'
      - 'dependencies'
      - 'documentation'
      - 'docs'
  default: patch

template: |
  ## Changes

  $CHANGES